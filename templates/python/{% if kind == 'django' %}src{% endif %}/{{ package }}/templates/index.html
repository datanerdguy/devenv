{% extends "base.html" %}
{% block content %}
<h1>Tarefas</h1>
<form hx-post="{% url 'add_todo' %}" hx-target="#todos" hx-on::after-request="this.reset()">
  <input name="text" placeholder="Nova tarefa" required autofocus>
  <button>Adicionar</button>
</form>
<div id="todos">{% include "_todos.html" %}</div>
{% endblock %}
