<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ .Title }}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/htmx.min.js" defer></script>
  </head>
  <body>
    <main>
      <h1>{{ .Title }}</h1>
      <form hx-post="/todos" hx-target="#todos" hx-on::after-request="this.reset()">
        <input name="text" placeholder="Nova tarefa" required autofocus>
        <button>Adicionar</button>
      </form>
      <div id="todos">{{ template "_todos.html" .Todos }}</div>
    </main>
  </body>
</html>
