# Git hooks (lefthook). O `new` já instala; num clone novo rode `lefthook install`.
pre-commit:
  jobs:
    - name: golangci-lint fmt
      glob: "*.go"
      run: golangci-lint fmt {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitizen
      run: cz check --allow-abort --commit-msg-file {1}
