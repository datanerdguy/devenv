# Rust: cole no Cargo.toml do projeto. O clippy roda ao salvar no Neovim.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Avisos extras do clippy, além dos padrão.
pedantic = { level = "warn", priority = -1 }
# Do pedantic, os que mais atrapalham que ajudam.
module_name_repetitions = "allow"
must_use_candidate = "allow"
