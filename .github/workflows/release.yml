# Release: cada push na main vira uma versão (tag + GitHub Release com as notas),
# calculada pelo commitizen a partir dos commits desde a última tag.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Instala o commitizen
        run: pipx install commitizen
      - name: Calcula a próxima versão
        id: version
        run: |
          # 21 é o NO_COMMITS_TO_BUMP do commitizen; qualquer outro erro falha o job.
          code=0
          next=$(cz bump --get-next --yes) || code=$?
          case "$code" in
            0) echo "next=$next" >> "$GITHUB_OUTPUT" ;;
            21) echo "Nenhum commit que gere versão (feat/fix/breaking). Nada a publicar." ;;
            *) exit "$code" ;;
          esac
      - name: Gera as notas e publica a release
        if: steps.version.outputs.next != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          # Notas só dos commits desde a última tag.
          start=()
          if prev=$(git describe --tags --abbrev=0 2>/dev/null); then start=(--start-rev "$prev"); fi
          cz changelog --dry-run --unreleased-version "v$NEXT" "${start[@]}" > notes.md
          git tag "v$NEXT"
          git push origin "v$NEXT"
          gh release create "v$NEXT" --title "v$NEXT" --notes-file notes.md
