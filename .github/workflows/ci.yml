# CI: roda em todo PR e em todo push para dev e main.
# As checagens que só fazem sentido em PR (origem e commits) ficam em pr.yml.
name: ci

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Formatação, statix, shellcheck, actionlint e stylua
        run: nix develop --command just lint

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # cache binário dos agentes (llm-agents.nix)
          extra-conf: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: nix flake check
        run: nix flake check --print-build-logs
      - name: Build de todos os hosts
        run: |
          for host in $(nix eval .#homeConfigurations --apply builtins.attrNames --json | jq -r '.[]'); do
            echo "::group::$host"
            nix build ".#homeConfigurations.$host.activationPackage" --print-build-logs
            echo "::endgroup::"
          done

  # Pacotes de sistema (system/<distro>.sh), sem o Nix: confere nomes e repositórios.
  system:
    name: system (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["fedora:latest", "ubuntu:24.04", "ubuntu:26.04"]
    steps:
      - uses: actions/checkout@v4
      - name: Roda o script da distro num container limpo
        run: tests/system.sh "${{ matrix.image }}"

  # Modelos de projeto: gera cada um com o `new` e roda o CI do projeto gerado (tests/templates.sh).
  templates:
    name: template (${{ matrix.case }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case:
          - python:lib
          - python:api
          - python:api:postgres
          - python:llm
          - python:data
          - python:ml
          - python:fastapi-htmx
          - python:django
          - python:streamlit
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # o copier lê o histórico do repo dos modelos
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Gera o projeto, roda o just ci dele e gera a imagem Docker
        run: tests/templates.sh "${{ matrix.case }}"
        env:
          DEVENV_TEST_DOCKER: "1"

  install:
    name: install (${{ matrix.image }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["fedora:latest", "ubuntu:24.04"]
    steps:
      - uses: actions/checkout@v4
      - name: Instala do zero num container limpo e roda os testes de fumaça
        run: tests/container.sh "${{ matrix.image }}"
