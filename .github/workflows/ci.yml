# CI: em todo PR e à mão. Roda no Arch (archlinux:latest), a base do CachyOS.
# Não roda no push para dev e main: o que chega lá já passou pelo mesmo CI no PR.
name: ci

on:
  pull_request:
  workflow_dispatch:
    inputs:
      completo:
        description: "Instala todos os grupos (o ci-completo de packages/config.toml), não só base e repo"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # O mesmo `just lint` do dia a dia.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: archlinux:latest
      options: --hostname ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Instala as ferramentas
        run: |
          pacman -Syu --noconfirm just shellcheck actionlint python uv stylua shfmt
          uv tool install keymap-drawer==0.23.0 # a versão muda os SVGs; suba junto com o just keyboard
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Lint
        run: just lint

  # Máquina nova de verdade: o bootstrap com um usuário comum. No PR, o grupo `ci` do metapac (base e repo);
  # à mão com completo=true, o `ci-completo` (todos os grupos menos debug e as máquinas, com os pacotes do AUR).
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.completo && 120 || 30 }}
    container:
      image: archlinux:latest
      options: --hostname ${{ inputs.completo && 'ci-completo' || 'ci' }}
    steps:
      # O git vem antes do checkout: sem ele, o checkout baixa o código sem o .git, e o smoke não consegue ver se
      # algum programa escreveu no repo.
      - name: Instala o git e o sudo
        run: pacman -Syu --noconfirm sudo git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cria um usuário com sudo sem senha
        run: |
          useradd --create-home dev
          echo 'dev ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/dev
          chown -R dev "$GITHUB_WORKSPACE"
      # O token do workflow sobe o limite da API do GitHub: sem ele, o bob (Neovim nightly) e o mise esbarram nele.
      - name: Bootstrap (sem rbw logado)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: sudo -u dev -H env CI=true GITHUB_TOKEN="${GITHUB_TOKEN}" ./bootstrap.sh
      # O segundo sync tem que passar sem fazer nada. Ele valida a lista com tudo já instalado
      # (o mise, por exemplo, só valida os nomes depois que existe).
      - name: Sync de novo
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: sudo -u dev -H env GITHUB_TOKEN="${GITHUB_TOKEN}" metapac sync --no-confirm
      - name: Smoke
        run: sudo -u dev -H env CI=true tests/smoke.sh
