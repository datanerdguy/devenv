# CI: a cada push na dev e na main, e à mão. Roda no Arch (archlinux:latest), a base do CachyOS.
name: ci

on:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      full:
        description: "Instala todos os grupos (o ci-full de packages/config.toml), não só base e repo"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # O mesmo `just lint` do dia a dia.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: archlinux:latest
      options: --hostname ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Instala as ferramentas
        run: |
          pacman -Syu --noconfirm just shellcheck actionlint python uv stylua shfmt
          uv tool install keymap-drawer==0.23.0 # a versão muda os SVGs; suba junto com o just keyboard
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Lint
        run: just lint

  # Máquina nova de verdade: o bootstrap com um usuário comum. No PR, o grupo `ci` do metapac (base e repo);
  # à mão com full=true, o `ci-full` (todos os grupos menos debug e as máquinas, com os pacotes do AUR).
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.full && 120 || 30 }}
    container:
      image: archlinux:latest
      options: --hostname ${{ inputs.full && 'ci-full' || 'ci' }}
    steps:
      # O git vem antes do checkout: sem ele, o código chega sem o .git e o smoke não vê o que escreveu no repo.
      - name: Instala o git e o sudo
        run: pacman -Syu --noconfirm sudo git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cria um usuário com sudo sem senha
        run: |
          useradd --create-home dev
          echo 'dev ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/dev
          chown -R dev "$GITHUB_WORKSPACE"
      # O token do workflow sobe o limite da API do GitHub: sem ele, o bob (Neovim nightly) e o mise esbarram nele.
      - name: Bootstrap (sem rbw logado)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: sudo -u dev -H env CI=true GITHUB_TOKEN="${GITHUB_TOKEN}" ./bootstrap.sh
      # O segundo sync tem que passar sem fazer nada: valida a lista com tudo já instalado.
      - name: Sync de novo
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: sudo -u dev -H env GITHUB_TOKEN="${GITHUB_TOKEN}" metapac sync --no-confirm
      - name: Smoke
        run: sudo -u dev -H env CI=true tests/smoke.sh
