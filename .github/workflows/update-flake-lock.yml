# Toda segunda-feira abre um PR para a dev atualizando o flake.lock.
# O CI do PR constrói e testa tudo antes de você aprovar.
name: update-flake-lock

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        with:
          base: dev
          branch: chore/update-flake-lock
          pr-title: "chore(deps): atualiza flake.lock"
          commit-msg: "chore(deps): atualiza flake.lock"
          pr-labels: dependencies
