# Toda segunda-feira abre um PR para a dev atualizando o flake.lock.
# O CI do PR constrói e testa tudo antes de você aprovar.
name: update-flake-lock

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/update-flake-lock@main
        with:
          base: dev
          branch: chore/update-flake-lock
          pr-title: "chore(deps): atualiza flake.lock"
          commit-msg: "chore(deps): atualiza flake.lock"
          pr-labels: dependencies
