# Noctalia. O que você muda pela tela de ajustes (Super+,) vai para ~/.local/state/noctalia/settings.toml,
# que vale por cima deste arquivo. `just noctalia-diff` mostra esses ajustes, para trazer ao repo o que ficar.
# Referência: https://docs.noctalia.dev/noctalia/configuration/

[shell]
# Pedidos de senha do polkit (Wi-Fi, montar disco) pelo próprio Noctalia.
polkit_agent = true
# Na visão geral do niri (Alt+O), começar a digitar abre o launcher.
niri_overview_type_to_launch_enabled = true
niri_overview_close_on_launch_enabled = true
# Histórico de cópias (Super+V): texto e imagens, os 30 últimos.
clipboard_history_max_entries = 30

# Tema: uma das paletas de palettes/ (geradas por temas/gerar.py). O comando `theme` troca; a escolha fica
# no estado do Noctalia, por cima deste padrão. docs/temas.md.
[theme]
mode = "dark"
source = "custom"
custom_palette = "nord"

# Apps que seguem o tema: o Noctalia regenera a config de cada um a cada troca e recarrega o que está aberto.
# fzf, bat, eza e o prompt usam as 16 cores do terminal, então seguem o Ghostty sem modelo próprio.
[theme.templates]
enable_builtin_templates = true
builtin_ids = ["ghostty", "niri", "gtk3", "gtk4", "qt", "btop"]
enable_community_templates = true
community_ids = ["zen-browser", "yazi"]

# Cor do cursor do fish em cada modo do vi (verde escreve, vermelho normal, amarelo visual).
# Variáveis universais: valem na hora em todos os fish abertos.
[theme.templates.user.fish_cursor]
input_path = "templates/fish-cursor.fish"
output_path = "$XDG_STATE_HOME/devenv/fish-cursor.fish"
post_hook = "fish -c \"source ${XDG_STATE_HOME:-$HOME/.local/state}/devenv/fish-cursor.fish\""

# lazygit: modelo nosso, sem o script da comunidade (ele reescreveria o config.yml, que é um link para o repo).
[theme.templates.user.lazygit]
input_path = "templates/lazygit.yml"
output_path = "$XDG_CONFIG_HOME/lazygit/themes/noctalia.yml"

# tmux: modelo nosso (o da comunidade roda um apply.sh que mexeria no tmux.conf, um link para o repo).
# O hook recarrega o tema no tmux aberto; sem tmux rodando, não há o que recarregar.
[theme.templates.user.tmux]
input_path = "templates/tmux.conf"
output_path = "$XDG_CONFIG_HOME/tmux/noctalia.conf"
post_hook = "tmux source-file \"${XDG_CONFIG_HOME:-$HOME/.config}/tmux/noctalia.conf\" 2>/dev/null || true"

# Papéis de parede: a pasta wallpapers/ do repo, ligada em ~/Pictures/Wallpapers.
[wallpaper]
directory = "~/Pictures/Wallpapers"

[lockscreen]
lock_before_suspend = true
