# Gerado pelo Noctalia a cada troca de tema (comando theme). A fonte é home/dot_config/noctalia/templates/.
# O tmux.conf lê este arquivo no fim; o post_hook recarrega no tmux aberto.
set -g @thm_bg "{{colors.surface.default.hex}}"
set -g @thm_fg "{{colors.on_surface.default.hex}}"
set -g @thm_muted "{{colors.outline.default.hex}}"
set -g @thm_surface "{{colors.surface_container_high.default.hex}}"
set -g @thm_primary "{{colors.primary.default.hex}}"
set -g @thm_alert "{{colors.terminal_normal_yellow.default.hex}}"
set -g status-style "bg={{colors.surface.default.hex}},fg={{colors.on_surface.default.hex}}"
set -g message-style "bg={{colors.surface_container_high.default.hex}},fg={{colors.on_surface.default.hex}}"
set -g mode-style "bg={{colors.surface_container_high.default.hex}},fg={{colors.primary.default.hex}}"
set -g pane-border-style "fg={{colors.outline.default.hex}}"
set -g pane-active-border-style "fg={{colors.primary.default.hex}}"
set -g popup-style "bg={{colors.surface.default.hex}},fg={{colors.on_surface.default.hex}}"
set -g popup-border-style "fg={{colors.primary.default.hex}}"
