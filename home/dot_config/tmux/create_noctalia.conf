# Tema inicial (Nord) até o primeiro `theme`: o Noctalia regrava este arquivo com o modelo
# home/dot_config/noctalia/templates/tmux.conf. O chezmoi só cria se ele faltar.
set -g @thm_bg "#2e3440"
set -g @thm_fg "#d8dee9"
set -g @thm_muted "#727d91"
set -g @thm_surface "#454c5a"
set -g @thm_primary "#88c0d0"
set -g @thm_alert "#ebcb8b"
set -g status-style "bg=#2e3440,fg=#d8dee9"
set -g message-style "bg=#454c5a,fg=#d8dee9"
set -g mode-style "bg=#454c5a,fg=#88c0d0"
set -g pane-border-style "fg=#727d91"
set -g pane-active-border-style "fg=#88c0d0"
set -g popup-style "bg=#2e3440,fg=#d8dee9"
set -g popup-border-style "fg=#88c0d0"
