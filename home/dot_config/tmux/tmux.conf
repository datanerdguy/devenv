# tmux sem plugins. Atalhos em docs/tmux.md. P = prefixo (Ctrl-Space).

# --- Básico -------------------------------------------------------------------
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix              # Ctrl-Space duas vezes manda um Ctrl-Space ao programa
set -g default-shell /usr/bin/fish
set -g default-terminal tmux-256color
set -as terminal-features ',xterm-ghostty:RGB:extkeys:clipboard,xterm-256color:RGB'
set -s escape-time 10                 # Esc rápido no Neovim
set -s extended-keys on
set -s set-clipboard on               # copiar no tmux vai para o clipboard do sistema (OSC 52 do Ghostty)
set -g allow-passthrough on           # imagens no Neovim dentro do tmux
set -g focus-events on                # o Neovim recarrega arquivos ao voltar o foco
set -g history-limit 50000
set -g mouse on
set -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off          # fechar a última janela troca de sessão em vez de sair
set -g display-time 2000

bind r source-file ~/.config/tmux/tmux.conf \; display "config recarregada"

# --- Janelas e painéis --------------------------------------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind x kill-pane
bind Tab last-window                  # p / n (padrão do tmux): janela anterior / próxima

# Ctrl-h/j/k/l: anda entre painéis do tmux e janelas do Neovim com as mesmas teclas.
# O Neovim marca o painel com @pane-is-vim; aí a tecla vai para ele.
bind -n C-h if -F "#{@pane-is-vim}" "send-keys C-h" "select-pane -L"
bind -n C-j if -F "#{@pane-is-vim}" "send-keys C-j" "select-pane -D"
bind -n C-k if -F "#{@pane-is-vim}" "send-keys C-k" "select-pane -U"
bind -n C-l if -F "#{@pane-is-vim}" "send-keys C-l" "select-pane -R"
bind C-l send-keys C-l                # P Ctrl-l limpa a tela do shell
# P h/j/k/l também anda; P H/J/K/L redimensiona (repete sem o prefixo). Nada com Alt: o Alt é do niri.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Copiar (modo vi) ---------------------------------------------------------
bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- Sessões e popups ---------------------------------------------------------
bind s display-popup -E -w 80% -h 70% -T " sessões " "fish -c t"   # sesh: sessões e projetos (função t do fish)
bind S run-shell "sesh last || tmux display 'sem sessão anterior'"
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
bind t display-popup -E -w 80% -h 75% -d "#{pane_current_path}"
bind a display-popup -E -w 90% -h 85% "workmux dashboard"
bind u display-popup -E -w 70% -h 50% -T " links " "fish -c '_devenv_urls #{pane_id}'"   # links da tela

# --- Barra --------------------------------------------------------------------
# Cores: ~/.config/tmux/noctalia.conf, lido no fim. O Noctalia regrava a cada `theme`; antes do primeiro, o
# chezmoi deixa um com o Nord. Ele define as @thm_* usadas abaixo e os estilos (barra, bordas, popups).
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 60
set -g popup-border-lines rounded

# A sessão fica amarela enquanto o prefixo está apertado.
set -g status-left "#[bg=#{?client_prefix,#{@thm_alert},#{@thm_primary}},fg=#{@thm_bg},bold] #S #[default] "
# @workmux_status: ícone do agente na janela (workmux, hooks em agents/settings.json).
set -g window-status-format "#[fg=#{@thm_muted}] #I #W#{?@workmux_status, #{@workmux_status},}#{?window_zoomed_flag, 󰊓,} "
set -g window-status-current-format "#[bg=#{@thm_surface},fg=#{@thm_primary},bold] #I #W#{?@workmux_status, #{@workmux_status},}#{?window_zoomed_flag, 󰊓,} "
# Cota do Claude (gravada pela statusline do Claude Code) e hora.
set -g status-right "#[fg=#{@thm_muted}]#(cat ~/.cache/devenv/claude-usage 2>/dev/null)  #[fg=#{@thm_fg}]%H:%M "

source-file ~/.config/tmux/noctalia.conf
