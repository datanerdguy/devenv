# --- Básico -----------------------------------------------------------------
bind C-Space send-prefix              # Ctrl-Space duas vezes manda um Ctrl-Space ao programa
set -g renumber-windows on
setw -g pane-base-index 1
set -g set-clipboard on               # copiar no tmux vai para o clipboard do sistema (OSC 52)
set -g allow-passthrough on           # imagens no Neovim (molten/image.nvim) dentro do tmux
set -g extended-keys on
set -as terminal-features ',xterm-ghostty:RGB:extkeys,xterm-256color:RGB'
set -g detach-on-destroy off          # fechar a última janela troca de sessão em vez de sair
set -g display-time 2000
set -g status-interval 5

# Recarregar a config
bind r source-file ~/.config/tmux/tmux.conf \; display "config recarregada"

# --- Janelas e painéis --------------------------------------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind x kill-pane
bind -r H previous-window
bind -r L next-window
bind Tab last-window
bind z resize-pane -Z

# Ctrl-h/j/k/l: anda entre painéis do tmux e janelas do Neovim com as mesmas teclas.
# O Neovim avisa que está no painel com @pane-is-vim (lua/pcastr/plugins/editor.lua).
bind -n C-h if -F "#{@pane-is-vim}" "send-keys C-h" "select-pane -L"
bind -n C-j if -F "#{@pane-is-vim}" "send-keys C-j" "select-pane -D"
bind -n C-k if -F "#{@pane-is-vim}" "send-keys C-k" "select-pane -U"
bind -n C-l if -F "#{@pane-is-vim}" "send-keys C-l" "select-pane -R"
# Alt-h/l e Ctrl-Alt-j/k: redimensionar (as mesmas do Neovim)
bind -n M-h if -F "#{@pane-is-vim}" "send-keys M-h" "resize-pane -L 3"
bind -n M-l if -F "#{@pane-is-vim}" "send-keys M-l" "resize-pane -R 3"
bind -n C-M-j if -F "#{@pane-is-vim}" "send-keys C-M-j" "resize-pane -D 3"
bind -n C-M-k if -F "#{@pane-is-vim}" "send-keys C-M-k" "resize-pane -U 3"
bind C-l send-keys C-l                # prefixo + Ctrl-l limpa a tela do shell

# --- Copiar (modo vi) ---------------------------------------------------------
bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- Popups -------------------------------------------------------------------
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
bind a display-popup -E -w 90% -h 85% "workmux dashboard"   # agentes (workmux)
bind u display-popup -E -w 90% -h 85% "tokscale --tui"      # uso e custo dos agentes
bind t display-popup -E -w 80% -h 75% -d "#{pane_current_path}"
bind S run-shell "sesh last || tmux display 'sem sessão anterior'"

# --- Aparência ------------------------------------------------------------------
set -g status-position top
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 60
set -g popup-border-lines rounded
# Cores do tema atual (comando `theme`). A barra mostra a sessão, as janelas,
# a cota do Claude (gravada pela statusline do Claude Code) e a hora.
source-file -q ~/.local/state/devenv/theme/current/tmux.conf
