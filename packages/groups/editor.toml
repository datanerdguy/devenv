# Editor: o Neovim pelo bob, que guarda as versões e deixa voltar para o nightly anterior (bob rollback).
# A config do Neovim é a área do Lucas.

[arch]
packages = [
  # O hook roda a cada sync e não faz nada se o nightly já estiver instalado e em uso.
  # O nvim fica em ~/.local/share/bob/nvim-bin, que precisa estar no PATH (área do shell).
  { name = "bob", hooks = { after_sync = ["bob", "use", "nightly"] } },
]
