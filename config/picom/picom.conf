# picom: compositor do i3 (X11). Só o necessário: sem tearing e com a transparência do tema.
# Sombras, cantos e animações ficam desligados para não pesar.
backend = "glx";
vsync = true;
use-damage = true;
shadow = false;
fading = false;
corner-radius = 0;
# Janelas em tela cheia sem compositor (jogos, vídeo).
unredir-if-possible = true;
