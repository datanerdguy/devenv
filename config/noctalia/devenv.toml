# Noctalia v5: config versionada, ligada em ~/.config/noctalia/devenv.toml.
# Ao lado ficam a paleta e o theme.toml do tema atual (comando `theme`, não edite).
# O que você muda pela tela de configurações (Super+,) vai para
# ~/.local/state/noctalia/settings.toml, que vale por cima deste arquivo.
# Para trazer um ajuste para o repo: `just noctalia-diff`.
# Referência: https://docs.noctalia.dev/noctalia/configuration/

[shell]
# Pedidos de senha do polkit (Wi-Fi, montar disco) pelo próprio Noctalia.
polkit_agent = true
# Na visão geral do niri (Super+O), começar a digitar abre o launcher.
niri_overview_type_to_launch_enabled = true
niri_overview_close_on_launch_enabled = true
# Histórico de cópias (Super+Ctrl+V): texto e imagens, os 30 últimos (itens fixados não contam).
# Fica criptografado em ~/.local/state/noctalia; para apagar tudo: `noctalia msg clipboard-clear`.
clipboard_history_max_entries = 30

[lockscreen]
lock_before_suspend = true

[hooks]
# Ao abrir, usa a paleta e o papel de parede do tema atual (comando `theme`, docs/themes.md).
started = "theme __sync-noctalia"
