# Igual ao do pacote do niri, mas com o seletor de arquivos no portal do GTK.
# O portal do GNOME delega o seletor ao Nautilus; sem ele, upload e download falham em silêncio.
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
org.freedesktop.impl.portal.FileChooser=gtk;
